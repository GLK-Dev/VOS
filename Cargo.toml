[workspace]
resolver = "2"
members = [
    "crates/vos-core",
    "crates/vos-store",
    "crates/vos-indexer",
    "crates/vos-mcp",
    "apps/vos-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license-file = "LICENSE.md"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4"] }
vos-core = { path = "crates/vos-core" }
vos-indexer = { path = "crates/vos-indexer" }
vos-mcp = { path = "crates/vos-mcp" }
vos-store = { path = "crates/vos-store" }
ignore = "0.4"



